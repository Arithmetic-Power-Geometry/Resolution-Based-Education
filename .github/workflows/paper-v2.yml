name: foundation-paper-sync

on:
  push:
    branches: ["rbe-paper-v2-framework-sync"]
  pull_request:
    paths:
      - "manuscript/foundation-sync/**"
      - "manuscript/v2/**"
      - "rbe/attainment.py"
      - "rbe/policy.py"
      - "tests/test_attainment.py"
      - "tests/test_policy.py"
      - ".github/workflows/paper-v2.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip pytest pandas numpy scikit-learn
      - name: Run repository tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q
      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-bibtex-extra biber texlive-pictures
      - name: Build synchronized foundation paper
        working-directory: manuscript/foundation-sync
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          biber main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          ! grep -E "LaTeX Warning:.*undefined|Overfull \\hbox" main.log
      - name: Upload compiled foundation paper
        uses: actions/upload-artifact@v4
        with:
          name: rbe-foundation-paper-synchronized
          path: manuscript/foundation-sync/main.pdf
