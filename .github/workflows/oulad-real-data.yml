name: OULAD real-data benchmark

on:
  push:
    paths:
      - 'benchmarks/oulad_resolution_benchmark.py'
      - '.github/workflows/oulad-real-data.yml'
  workflow_dispatch:

jobs:
  oulad:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas numpy
      - name: Run full OULAD benchmark
        run: python benchmarks/oulad_resolution_benchmark.py
      - name: Save benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: oulad-resolution-results
          path: reports/oulad_resolution_results.csv
