name: OULAD selective falsification
on:
  workflow_dispatch:
  push:
    paths:
      - 'benchmarks/oulad_selective_falsification.py'
      - 'tests/test_oulad_selective_falsification.py'
      - '.github/workflows/oulad-selective-falsification.yml'
jobs:
  falsification:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas numpy scikit-learn pytest
      - name: Run offline controls
        run: python -m pytest -q tests/test_oulad_selective_falsification.py
      - name: Run full OULAD falsification
        run: python -m benchmarks.oulad_selective_falsification
      - uses: actions/upload-artifact@v4
        with:
          name: oulad-selective-falsification-results
          path: reports/oulad_selective_falsification_results.csv
